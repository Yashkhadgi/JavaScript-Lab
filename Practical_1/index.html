<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Basics | Inline, Internal & External</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css" />

  <!-- ===== EXTERNAL JAVASCRIPT ===== -->
  <!-- Linked separate file, "defer" makes it run only after HTML is parsed -->
  <script src="script.js" defer></script>

  <!-- ===== INTERNAL JAVASCRIPT ===== -->
  <!-- Written directly inside this HTML file, used for small page-specific -->
  <!-- logic: here it's a live character counter for the name input. -->
  <script>
    // Runs after the full HTML document has loaded
    document.addEventListener('DOMContentLoaded', () => {
      const nameInput = document.getElementById('nameInput');
      const counterEl = document.getElementById('charCounter');

      // "input" event fires every time the user types/deletes a character
      nameInput.addEventListener('input', () => {
        const len = nameInput.value.length; // number of characters typed
        counterEl.textContent = `${len} character${len !== 1 ? 's' : ''} typed`;
      });
    });
  </script>
</head>
<body>

  <!-- ===== TOP HERO BANNER ===== -->
  <section class="hero">
    <div class="hero-badge"><i class="fa-solid fa-code"></i></div>
    <h1>JavaScript Fundamentals Portal</h1>
    <p class="hero-sub">Demonstrating Inline, Internal &amp; External JavaScript</p>

    <div class="pill-row">
      <span class="pill">Inline JS</span>
      <span class="pill">Internal JS</span>
      <span class="pill">External JS</span>
    </div>
  </section>

  <div class="wrapper">

    <!-- ===== MAIN CARD ===== -->
    <main class="card">

      <div class="card-header">
        <i class="fa-solid fa-user-pen"></i>
        <div>
          <h2>Enter Your Details</h2>
          <p>This form is powered by our External JS file</p>
        </div>
      </div>

      <div class="form-group">
        <label for="nameInput"><i class="fa-solid fa-id-badge"></i> Full Name</label>
        <input type="text" id="nameInput" placeholder="e.g. Yash Khadgi" />
        <!-- This span is updated live by our INTERNAL JS block above -->
        <span class="char-counter" id="charCounter">0 characters typed</span>
      </div>

      <div class="form-group">
        <label for="emailInput"><i class="fa-solid fa-envelope"></i> Email</label>
        <input type="email" id="emailInput" placeholder="e.g. yash@example.com" />
      </div>

      <div class="form-group">
        <label for="ageInput"><i class="fa-solid fa-cake-candles"></i> Age</label>
        <input type="number" id="ageInput" placeholder="e.g. 20" />
      </div>

      <div class="btn-row">
        <!-- ===== INLINE JAVASCRIPT ===== -->
        <!-- JS written directly in the "onclick" attribute of this tag -->
        <button class="btn btn-secondary"
          onclick="alert('👋 This alert was triggered by INLINE JavaScript (written directly inside the HTML tag)!')">
          <i class="fa-solid fa-bolt"></i> Try Inline JS
        </button>

        <!-- Calls a function defined in our EXTERNAL script.js file -->
        <button class="btn btn-primary" onclick="showWelcomeMessage()">
          <i class="fa-solid fa-paper-plane"></i> Show Welcome Message
        </button>
      </div>

      <!-- Result card, shown/hidden dynamically by External JS -->
      <div id="resultBox" class="result-box hidden"></div>

      <!-- Button to run console methods demo (External JS) -->
      <button class="btn btn-outline" onclick="runConsoleDemo()">
        <i class="fa-solid fa-terminal"></i> Run Console Methods Demo (Open DevTools → Console)
      </button>

    </main>

    <footer>
      Designed by <span class="highlight">Yash Khadgi</span> | PRN: 24070521137
    </footer>

  </div>

</body>
</html>
