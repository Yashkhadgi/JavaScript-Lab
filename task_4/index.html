<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bollywood Hits - Movies by Year</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <header class="glass-header">
        <h1>Bollywood <span class="highlight">Hits</span></h1>
        <p>Top Rated Bollywood Movies Organized by Year</p>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search movies..." autocomplete="off">
        </div>
    </header>

    <main id="app-container" class="container">
        <!-- Content will be injected by app.js -->
        <div class="loader">Loading Movies...</div>
    </main>

    <footer>
        <p>&copy; 2026 Bollywood Hits App. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
