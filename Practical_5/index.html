<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Boutique De Paris - Scandinavian Storefront</title>
    <!-- ===== GOOGLE FONTS (PLAYFAIR DISPLAY & INTER) ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- ===== FONT AWESOME ICONS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- ===== CUSTOM CSS ===== -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shop-viewport">
        <!-- ===== MINIMALIST HEADER NAVBAR ===== -->
        <header class="shop-navbar">
            <div class="brand-box">
                <span class="edition-lbl">PARIS &bull; EST. 2026</span>
                <h1 class="shop-logo">LA BOUTIQUE DE PARIS</h1>
            </div>

            <button class="cart-trigger-btn" id="btn-toggle-bag">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="bag-lbl">SHOPPING BAG</span>
                <span class="bag-count-pill" id="bag-count-pill">0</span>
            </button>
        </header>

        <!-- ===== MAIN STOREFRONT WORKSPACE ===== -->
        <main class="shop-workspace">
            
            <!-- LEFT 3-COLUMN PRODUCT CATALOG (68% width) -->
            <section class="catalog-panel">
                <div class="catalog-header">
                    <h2>SELECTED CREATIONS</h2>
                    <span class="catalog-tag">AUTUMN / WINTER 2026</span>
                </div>

                <div class="catalog-grid-scroll">
                    <div class="product-grid-3col" id="product-grid-3col">
                        <!-- Dynamic Scandinavian Product Cards -->
                    </div>
                </div>
            </section>

            <!-- RIGHT CHECKOUT RECEIPT DRAWER (32% width) -->
            <aside class="checkout-panel">
                <div class="receipt-card">
                    <div class="receipt-head">
                        <h3>Order Summary</h3>
                        <p class="receipt-date" id="receipt-date-str">AUGUST 04, 2026</p>
                    </div>

                    <!-- Cart Itemized List -->
                    <div class="cart-items-scroll" id="cart-items-container">
                        <div class="cart-empty-state" id="cart-empty-state">
                            <i class="fa-solid fa-basket-shopping empty-cart-icon"></i>
                            <p>Your shopping bag is currently empty.</p>
                        </div>
                    </div>

                    <!-- Calculations Breakdown -->
                    <div class="cart-summary-box">
                        <div class="summary-line">
                            <span>Subtotal</span>
                            <span class="val-price" id="val-subtotal">₹0.00</span>
                        </div>
                        <div class="summary-line">
                            <span>GST Tax (18%)</span>
                            <span class="val-price" id="val-tax">₹0.00</span>
                        </div>
                        <div class="divider-thin"></div>
                        <div class="summary-line total-line">
                            <span>Total</span>
                            <span class="val-price" id="val-total">₹0.00</span>
                        </div>
                    </div>

                    <button class="btn-checkout-submit" id="btn-checkout" disabled>
                        Proceed to Checkout
                    </button>
                </div>
            </aside>

        </main>

        <!-- ===== PROMINENT AUTHOR FOOTER ===== -->
        <footer class="shop-footer">
            <div class="footer-bar">
                Designed by <strong>Yash Khadge</strong> | PRN: <strong>24070521137</strong>
            </div>
        </footer>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="script.js"></script>
</body>
</html>
