<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your secure dashboard — activity overview and session management.">
    <!-- Strict cache prevention for protected page -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, post-check=0, pre-check=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>SecureAuth — Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Guard: redirect to login if not authenticated, BEFORE page renders -->
    <script>
        (function () {
            const token = localStorage.getItem('auth_token');
            const email = localStorage.getItem('auth_email');
            if (!token || !email) {
                window.location.replace('index.html');
            }
        })();
    </script>
</head>
<body>
    <!-- Loading overlay shown while fetching dashboard data -->
    <div class="loading-overlay" id="loading-overlay" aria-live="polite" aria-label="Loading dashboard">
        <div class="loader"></div>
    </div>

    <main class="page" role="main">
        <div class="dashboard-card" role="region" aria-label="User Dashboard">

            <!-- ── Header ── -->
            <div class="dash-header">
                <div class="dash-user">
                    <div class="user-avatar" id="user-avatar" aria-hidden="true">?</div>
                    <div class="user-info">
                        <div class="label">Signed in as</div>
                        <div class="email" id="user-email">Loading...</div>
                    </div>
                </div>
                <div class="status-badge" role="status">
                    <div class="status-dot"></div>
                    Active Session
                </div>
            </div>

            <!-- ── Body ── -->
            <div class="dash-body">

                <!-- Token Info -->
                <div class="section-title">Session Details</div>
                <div class="token-info" id="token-info">
                    <div class="token-stat">
                        <div class="stat-label">Issued At</div>
                        <div class="stat-value" id="token-issued">—</div>
                    </div>
                    <div class="token-stat">
                        <div class="stat-label">Expires At</div>
                        <div class="stat-value" id="token-expires">—</div>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Recent Activity -->
                <div class="section-title">Recent Activity</div>
                <div class="activity-table-wrapper">
                    <div id="activity-container">
                        <!-- Populated by app.js -->
                        <div class="no-activity">
                            <div class="no-activity-icon">⏳</div>
                            Loading activity...
                        </div>
                    </div>
                </div>

                <!-- Logout -->
                <button class="btn-logout" id="btn-logout" aria-label="Sign out of your account">
                    <span>🚪</span> Sign Out
                </button>

                <div class="alert alert-error" id="dash-error" role="alert" aria-live="polite"></div>

            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
