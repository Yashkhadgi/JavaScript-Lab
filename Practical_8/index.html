<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Forge Club - Athletic Member Portal</title>
    <!-- ===== GOOGLE FONTS (MONTSERRAT & INTER) ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <!-- ===== FONT AWESOME ICONS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- ===== CUSTOM CSS ===== -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Image with Blur Overlay -->
    <div class="blurred-gym-overlay"></div>

    <div class="nike-viewport">
        <!-- ===== NIKE ATHLETIC NAVBAR ===== -->
        <header class="nike-navbar">
            <div class="brand-box">
                <div class="logo-icon"><i class="fa-solid fa-dumbbell"></i></div>
                <div>
                    <h1 class="brand-title">IRON FORGE ATHLETIC CLUB</h1>
                    <p class="brand-sub">VIP Membership Registration Portal</p>
                </div>
            </div>
            <div class="status-badge">
                <i class="fa-solid fa-circle text-lime"></i> ADMISSIONS OPEN
            </div>
        </header>

        <!-- ===== MAIN 2-COLUMN WORKSPACE ===== -->
        <main class="nike-workspace">
            
            <!-- LEFT COLUMN: STEP-BY-STEP REGISTRATION FORM (55% width) -->
            <section class="nike-card panel-form">
                <div class="card-head">
                    <i class="fa-solid fa-user-plus"></i>
                    <h2>Candidate Membership Form</h2>
                </div>

                <form id="gym-form" class="nike-form" novalidate>
                    <!-- Row 1: Name & Age -->
                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="gym-name">Full Candidate Name</label>
                            <div class="input-wrap">
                                <input type="text" id="gym-name" placeholder="e.g. Yash Khadge" autocomplete="off">
                                <span class="indicator-icon" id="name-status"><i class="fa-solid fa-minus neutral"></i></span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="gym-age">Age (16 - 65)</label>
                            <div class="input-wrap">
                                <input type="number" id="gym-age" placeholder="Age" autocomplete="off">
                                <span class="indicator-icon" id="age-status"><i class="fa-solid fa-minus neutral"></i></span>
                            </div>
                        </div>
                    </div>

                    <!-- Row 2: Phone & Email -->
                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="gym-phone">Phone Number (10 Digits)</label>
                            <div class="input-wrap">
                                <input type="tel" id="gym-phone" placeholder="9876543210" autocomplete="off">
                                <span class="indicator-icon" id="phone-status"><i class="fa-solid fa-minus neutral"></i></span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="gym-email">Email Address</label>
                            <div class="input-wrap">
                                <input type="email" id="gym-email" placeholder="name@domain.com" autocomplete="off">
                                <span class="indicator-icon" id="email-status"><i class="fa-solid fa-minus neutral"></i></span>
                            </div>
                        </div>
                    </div>

                    <!-- Tier Custom Radio Cards -->
                    <div class="form-group">
                        <label>Select Membership Tier</label>
                        <div class="tier-radio-grid">
                            <label class="tier-card active">
                                <input type="radio" name="tier" value="basic">
                                <span class="tier-name">BASIC FIT</span>
                                <span class="tier-price">₹999/mo</span>
                            </label>
                            <label class="tier-card">
                                <input type="radio" name="tier" value="standard" checked>
                                <span class="tier-name">STANDARD</span>
                                <span class="tier-price">₹1,999/mo</span>
                            </label>
                            <label class="tier-card">
                                <input type="radio" name="tier" value="elite">
                                <span class="tier-name">ELITE VIP</span>
                                <span class="tier-price">₹3,499/mo</span>
                            </label>
                        </div>
                    </div>

                    <!-- Training Slot -->
                    <div class="form-group">
                        <label for="gym-slot">Training Slot</label>
                        <select id="gym-slot">
                            <option value="morning">MORNING (06:00 - 10:00)</option>
                            <option value="evening" selected>EVENING (16:00 - 21:00)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-nike-submit" id="btn-submit" disabled>
                        <i class="fa-solid fa-lock"></i> Verification Pending
                    </button>
                </form>
            </section>

            <!-- RIGHT COLUMN: REALISTIC DIGITAL PASS PREVIEW (45% width) -->
            <section class="nike-card panel-pass">
                <div class="card-head">
                    <i class="fa-solid fa-id-card"></i>
                    <h2>Digital Member Access Pass</h2>
                </div>

                <div class="pass-stage">
                    <div class="real-member-pass">
                        <div class="pass-header-row">
                            <span class="pass-brand-title"><i class="fa-solid fa-dumbbell"></i> IRON FORGE</span>
                            <span class="pass-tier-tag" id="badge-tier-txt">STANDARD</span>
                        </div>

                        <div class="pass-body-row">
                            <div class="member-photo-box">
                                <i class="fa-solid fa-user user-icon"></i>
                            </div>
                            <div class="member-details-col">
                                <div class="pass-line">
                                    <span class="lbl">MEMBER:</span>
                                    <span class="val" id="rec-name">Yash Khadge</span>
                                </div>
                                <div class="pass-line">
                                    <span class="lbl">MEMBER ID:</span>
                                    <span class="val mono text-lime" id="rec-id">IF-98042</span>
                                </div>
                                <div class="pass-line">
                                    <span class="lbl">SLOT:</span>
                                    <span class="val" id="rec-slot">EVENING</span>
                                </div>
                            </div>
                        </div>

                        <div class="pass-footer-row">
                            <div class="barcode-graphics"></div>
                            <span class="pass-prn-code mono">PRN: 24070521137</span>
                        </div>
                    </div>
                </div>
            </section>

        </main>

        <!-- ===== PROMINENT AUTHOR FOOTER ===== -->
        <footer class="nike-footer">
            <div class="footer-bar">
                Designed by <strong>Yash Khadge</strong> | PRN: <strong>24070521137</strong>
            </div>
        </footer>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="script.js"></script>
</body>
</html>
