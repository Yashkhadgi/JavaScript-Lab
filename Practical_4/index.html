<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raycast Utility - Palindrome Analyzer</title>
    <!-- ===== GOOGLE FONTS (INTER & JETBRAINS MONO) ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- ===== FONT AWESOME ICONS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- ===== CUSTOM CSS ===== -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="raycast-viewport">
        <!-- ===== CENTERED UTILITY BOX (RAYCAST STYLE) ===== -->
        <main class="raycast-modal">
            
            <!-- SEARCH-BAR INPUT HEADER -->
            <div class="search-input-header">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="palindrome-input" value="A man a plan a canal Panama" placeholder="Type a string phrase to inspect symmetry..." autocomplete="off">
                <span class="cmd-shortcut">⌘K</span>
            </div>

            <!-- PRESETS QUICK BAR -->
            <div class="presets-row">
                <span class="presets-lbl">PRESETS:</span>
                <button class="preset-chip" data-text="racecar">racecar</button>
                <button class="preset-chip" data-text="A man a plan a canal Panama">canal Panama</button>
                <button class="preset-chip" data-text="never odd or even">never odd or even</button>
                <button class="preset-chip" data-text="javascript">javascript</button>
            </div>

            <!-- CHARACTER ANALYSIS GRID -->
            <div class="raycast-body">
                
                <!-- Status Banner -->
                <div class="status-banner" id="status-banner">
                    <div class="flex-align gap-2">
                        <i class="fa-solid fa-circle-check status-icon" id="status-icon"></i>
                        <div>
                            <h3 class="status-title" id="status-title">Palindrome Confirmed</h3>
                            <p class="status-sub" id="status-sub">Forward and reversed alphanumeric sequences are symmetrical.</p>
                        </div>
                    </div>
                    <span class="badge-pct mono" id="symmetry-pct">100%</span>
                </div>

                <!-- Grid Character Matrix Box -->
                <div class="matrix-card">
                    <div class="matrix-head">
                        <span>Character Position Alignment Grid</span>
                    </div>

                    <div class="matrix-scroll-wrapper">
                        <!-- Forward row -->
                        <div class="char-row-wrap">
                            <span class="row-tag">FORWARD</span>
                            <div class="char-boxes-flex" id="forward-box-container">
                                <!-- Dynamic character boxes -->
                            </div>
                        </div>

                        <!-- Connector row -->
                        <div class="connector-row" id="connector-row-container">
                            <!-- Dynamic connector icons -->
                        </div>

                        <!-- Reverse row -->
                        <div class="char-row-wrap">
                            <span class="row-tag">REVERSED</span>
                            <div class="char-boxes-flex" id="reverse-box-container">
                                <!-- Dynamic character boxes -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Metrics Metrics Footer Details -->
                <div class="telemetry-grid">
                    <div class="tele-box">
                        <span class="tele-lbl">Raw Length</span>
                        <span class="tele-val mono" id="val-raw-len">30</span>
                    </div>
                    <div class="tele-box">
                        <span class="tele-lbl">Cleaned Length</span>
                        <span class="tele-val mono" id="val-clean-len">21</span>
                    </div>
                    <div class="tele-box">
                        <span class="tele-lbl">Sanitized String</span>
                        <span class="tele-val mono text-truncate" id="val-clean-str">amanaplanacanalpanama</span>
                    </div>
                </div>

            </div>

            <!-- RAYCAST MODAL FOOTER -->
            <footer class="raycast-footer">
                <div class="footer-left">
                    <i class="fa-solid fa-terminal"></i> Designed by <strong>Yash Khadge</strong> | PRN: <strong>24070521137</strong>
                </div>
                <div class="footer-right">
                    <span>Press <kbd>Enter</kbd> to inspect</span>
                </div>
            </footer>

        </main>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="script.js"></script>
</body>
</html>
