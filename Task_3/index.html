<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadata about the document -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3: Phone Number Validation</title>

    <!-- 
      This is the link to our CSS file which we will create next. 
      It tells the HTML to look for styling instructions in 'style.css'.
    -->
    <link rel="stylesheet" href="style.css">

    <!-- 
      CRUCIAL STEP FOR jQuery!
      This script tag downloads the jQuery library from the internet (Google's CDN).
      Without this line, none of our jQuery code will work because the browser won't know what '$' means.
    -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- EMAILJS SDK -->
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
</head>
<body>

    <!-- A main container to hold our app -->
    <div class="container">
        <h2>Verification System</h2>
        
        <!-- The Initial Form (Email and Phone) -->
        <div id="initial-form">
            <input type="email" id="email-input" placeholder="College Email (e.g. student@college.edu)">
            <br><br>
            <input type="text" id="phone-input" placeholder="Phone (e.g., 9876543210)">
            <br><br>
            <button id="submit-btn">Send OTP to Email</button>
        </div>

        <!-- The OTP Section (Hidden by default) -->
        <div id="otp-section" style="display: none;">
            <h3>Enter OTP</h3>
            <p>An OTP has been sent to your email.</p>
            <input type="text" id="otp-input" placeholder="4-digit OTP">
            <br><br>
            <button id="verify-btn">Verify OTP</button>
            <p id="timer-display" style="margin-top: 10px; font-weight: bold;">Expires in: 30s</p>
        </div>

        <!-- The Message Area -->
        <p id="message"></p>
    </div>

    <!-- 
      This links our custom JavaScript file to the HTML.
      We put it at the end of the <body> so the HTML elements load before the script tries to find them.
    -->
    <script src="script.js"></script>
</body>
</html>
